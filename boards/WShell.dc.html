<style>
body{margin:0}
button,input{font-family:inherit}
.ws-root{width:1440px;height:900px;overflow:hidden}
.mk-app{display:flex;height:900px;background:#14173F;font-family:'Mona Sans',system-ui,sans-serif;color:#0E2B30}
.w-rail{width:56px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;padding:12px 0;gap:4px;color:#C9CDEA}
.w-rail .ws{width:30px;height:30px;border-radius:999px;background:#fff;color:#14173F;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-bottom:6px}
.w-rail .tile{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;margin-bottom:6px}
.w-rail .tile.on{background:#222861;border:1px solid #4350A8}
.w-rail .ic{width:40px;height:34px;display:flex;align-items:center;justify-content:center;opacity:.85}
.w-rail .sp{flex-grow:1}
.w-rail .av{width:30px;height:30px;border-radius:999px;background:linear-gradient(135deg,#F6A28B,#7A6BE0)}
.g-frame{flex:1;min-width:0;margin:12px 12px 12px 0;background:#fff;border-radius:24px;display:flex;overflow:hidden}
.ic{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
/* sidebar */
.g-side{width:260px;flex:none;box-sizing:border-box;background:#F3F9F6;border-right:1px solid #DCE8E4;display:flex;flex-direction:column;padding:12px 10px}
.g-shead{display:flex;align-items:center;justify-content:space-between;height:36px;padding:0 2px 0 8px;margin-bottom:10px}
.g-brand{display:inline-flex;align-items:center;gap:7px;font-size:20px;font-weight:600;letter-spacing:-.045em;color:#0E2B30}
.g-sicons{display:flex;gap:2px}
.g-ibtn{width:32px;height:32px;border:none;background:none;border-radius:8px;color:#4A5E61;display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.g-ibtn:hover{background:#DCE8E4;color:#0E2B30}
.g-new{height:40px;border:none;border-radius:999px;background:#0E2B30;color:#fff;display:flex;align-items:center;gap:10px;padding:0 16px;font-size:14px;font-weight:600;cursor:pointer;margin-bottom:6px}
.g-new:hover{background:#173B41}
.g-nav{height:38px;border:none;background:none;border-radius:10px;display:flex;align-items:center;gap:10px;padding:0 12px;font-size:14px;color:#0E2B30;cursor:pointer;text-align:left;width:100%}
.g-nav:hover{background:#DCE8E4}
.g-label{font-size:12.5px;color:#7D9093;padding:18px 12px 6px}
.g-item{border:none;background:none;text-align:left;border-radius:10px;padding:9px 12px;color:#0E2B30;font-size:13.5px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;width:100%}
.g-item:hover{background:#DCE8E4}
.g-item--on{background:#DCE8E4;font-weight:500}
.g-seeall{border:none;background:none;text-align:left;padding:9px 12px;font-size:13.5px;font-weight:600;color:#4A5E61;cursor:pointer}
.g-sp{flex:1}
.g-me{display:flex;align-items:center;gap:10px;padding:8px 8px;border-radius:10px}
.g-me .av{width:30px;height:30px;border-radius:999px;background:linear-gradient(135deg,#F6A28B,#7A6BE0);flex:none}
.g-me b{display:block;font-size:13.5px;font-weight:600}
.g-me>span>span{display:block;font-size:12px;color:#4A5E61}
.g-me .g-cr{display:inline;color:#0B7A4D;font-weight:600}
/* center */
.g-center{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}
.g-top{height:56px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 14px 0 20px}
.g-skill{display:inline-flex;align-items:center;gap:8px}
.ws-pill{height:22px;border-radius:999px;padding:0 9px;display:inline-flex;align-items:center;font-size:11.5px;font-weight:600;letter-spacing:.04em}
.g-tright{display:flex;gap:4px;align-items:center}
.g-share{height:34px;border-radius:999px;border:1px solid #DCE8E4;background:#fff;display:inline-flex;align-items:center;gap:6px;padding:0 14px;font-size:13px;font-weight:500;color:#0E2B30;cursor:pointer}
.g-thread{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column-reverse;align-items:center;padding:0 24px}
.g-col{width:100%;max-width:720px;display:flex;flex-direction:column;gap:22px;padding:8px 0 24px}
.g-user{align-self:flex-end;max-width:80%;background:#F3F9F6;border-radius:22px;padding:12px 18px;font-size:16px;line-height:24px}
.g-mel{display:flex;flex-direction:column;gap:12px}
.g-mel p{margin:0;font-size:16px;line-height:24px}
.g-rows{display:flex;flex-direction:column;gap:2px;margin-left:-10px}
.g-row{border:none;background:none;text-align:left;display:flex;gap:10px;align-items:baseline;padding:7px 10px;border-radius:8px;font-size:14px;line-height:20px;color:#4A5E61;cursor:pointer}
.g-row:hover{background:#F3F9F6;color:#0E2B30}
.g-row i{font-style:normal;color:#7D9093}
.g-dock{flex:none;display:flex;justify-content:center;padding:0 24px 20px}
.g-box{width:100%;max-width:720px;box-sizing:border-box;border:1px solid #DCE8E4;border-radius:26px;background:#fff;box-shadow:0 2px 10px rgba(14,43,48,.05);padding:14px 12px 10px 18px;display:flex;flex-direction:column;gap:10px}
.g-box:focus-within{border-color:#DCE8E4;box-shadow:0 0 0 4px rgba(14,43,48,.05)}
.g-field{border:none;outline:none;background:none;font-size:15.5px;color:#0E2B30;padding:2px 0;width:100%}
.g-field::placeholder{color:#7D9093}
.g-brow{display:flex;align-items:center;justify-content:space-between;margin-left:-6px}
.g-bright{display:flex;align-items:center;gap:6px}
.g-voice{width:38px;height:38px;border-radius:999px;border:none;background:#0E2B30;color:#fff;display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.g-voice .ic{width:18px;height:18px}
/* draft card */
.g-card{border:1px solid #DCE8E4;border-radius:18px;background:#fff;overflow:hidden}
.g-chead{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid #DCE8E4;font-size:13.5px}
.g-chead b{font-weight:600}
.g-chead span{color:#4A5E61}
.g-pieces{display:flex;gap:12px;padding:14px;overflow-x:auto}
.g-piece{width:204px;flex:none;display:flex;flex-direction:column;gap:8px}
.g-thumb{position:relative;width:204px;height:204px;border-radius:12px;overflow:hidden;background:#F3F9F6}
.g-thumb--tall{height:256px}
.g-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.g-exp{position:absolute;top:8px;right:8px;width:30px;height:30px;border-radius:999px;border:none;background:rgba(255,255,255,.92);color:#0E2B30;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.15)}
.g-exp .ic{width:14px;height:14px}
.g-badge{position:absolute;left:8px;bottom:8px;height:22px;border-radius:999px;background:rgba(14,43,48,.75);color:#fff;font-size:11px;font-weight:600;display:inline-flex;align-items:center;gap:4px;padding:0 8px}
.g-badge .ic{width:10px;height:10px;fill:currentColor;stroke:none}
.g-cap{font-size:12.5px;line-height:18px;margin:0}
.g-tags{font-size:12px;line-height:17px;color:#1F5A7A;margin:0}
.g-cfoot{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border-top:1px solid #DCE8E4}
.g-cfoot span{font-size:12.5px;color:#4A5E61}
.g-btn{height:32px;border-radius:999px;border:1px solid #0E2B30;background:#0E2B30;color:#fff;padding:0 14px;font-size:13px;font-weight:600;cursor:pointer}
.g-btn--ghost{background:#fff;color:#0E2B30;border-color:#DCE8E4}
.g-done{font-size:13px;font-weight:600;color:#0B7A4D}
/* viewer */
.g-view{width:600px;flex:none;box-sizing:border-box;border-left:1px solid #DCE8E4;background:#F3F9F6;display:flex;flex-direction:column}
.g-vtop{height:56px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 10px 0 18px;border-bottom:1px solid #DCE8E4;background:#fff}
.g-vtitle{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600}
.g-vtitle span{font-weight:400;color:#4A5E61}
.g-vbody{flex:1;min-height:0;display:flex;gap:14px;padding:18px}
.g-strip{display:flex;flex-direction:column;gap:8px;justify-content:center}
.g-sthumb{width:56px;height:56px;border-radius:8px;overflow:hidden;border:2px solid transparent;padding:0;cursor:pointer;background:none}
.g-sthumb img{width:100%;height:100%;object-fit:cover;display:block}
.g-sthumb--on{border-color:#0E2B30}
.g-stage{flex:1;min-width:0;display:flex;flex-direction:column;gap:12px;align-items:center;justify-content:center}
.g-big{max-width:100%;max-height:560px;border-radius:14px;overflow:hidden;box-shadow:0 6px 24px rgba(14,43,48,.12);position:relative}
.g-big img{display:block;width:420px;height:420px;object-fit:cover}
.g-big--tall img{width:360px;height:560px}
.g-vcap{width:100%;max-width:420px;display:flex;flex-direction:column;gap:4px}
.g-vcap p{margin:0;font-size:13.5px;line-height:20px}
.g-vcap .g-tags{font-size:13px}
.ws-intro{width:100%;--space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-gutter:0px;--radius-card:14px;--radius-tile:10px;--radius-badge:6px;--surface-card:#FFFFFF;--surface-tile:#F3F9F6;--border-card:#DCE8E4;--text-primary:#0E2B30;--text-secondary:#4A5E61;--text-tertiary:#7D9093;--bg-page:#FFFFFF;--status-success-bg:#E2F5EA;--status-success-fg:#0B7A4D;--status-warning-bg:#FDF1E1;--status-warning-fg:#9A5B00;color:#0E2B30}
.ws-intro .t-body-strong{font-size:14px;line-height:20px;font-weight:600}
.ws-intro .t-meta{font-size:12.5px;line-height:18px}
.ws-intro .t-caption{font-size:11.5px;line-height:16px}
.ws-intro .t-secondary{color:#4A5E61}
.ws-intro .m-intro{margin-top:4px}
.ws-intro .m-ic:hover{box-shadow:inset 0 0 0 1px #12A867}

.m-intro{display:flex;flex-direction:column;gap:var(--space-3);margin-top:var(--space-4)}

.m-ir{display:flex;gap:var(--space-3);overflow-x:auto;scroll-snap-type:x mandatory;margin:0 calc(var(--space-gutter) * -1);padding:0 var(--space-gutter);scroll-padding-inline:var(--space-gutter);scrollbar-width:none}

.m-ir::-webkit-scrollbar{display:none}

.m-ic{flex:none;width:280px;scroll-snap-align:start;display:flex;flex-direction:column;padding:0;border:0;border-radius:var(--radius-card);background:var(--surface-card);box-shadow:inset 0 0 0 1px var(--border-card);overflow:hidden;color:var(--text-primary);font:inherit;text-align:left;cursor:pointer}

.m-ic__prev{display:block;aspect-ratio:4/3;background:var(--surface-tile);position:relative;overflow:hidden}

.m-ic__body{display:flex;flex-direction:column;gap:var(--space-1);padding:var(--space-3) var(--space-3) var(--space-4)}

.m-ic__head{display:flex;align-items:center;gap:var(--space-2)}

.m-ic__desc{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.5em}

.m-dots{display:flex;justify-content:center;gap:6px}

.m-dots span{width:6px;height:6px;border-radius:50%;background:var(--text-tertiary);opacity:.5}

.m-dots span.m-dot--on{width:16px;border-radius:3px;background:var(--text-primary);opacity:1}

.m-iv{position:absolute;inset:0;box-sizing:border-box;padding:var(--space-4);display:flex;flex-direction:column;justify-content:center;gap:var(--space-2)}

.m-iv b{font-weight:600}

.m-iv--img{padding:0}

.m-iv--img>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}

.m-iv--img>img.m-iv__float{inset:auto var(--space-3) var(--space-3) auto;width:38%;height:auto;aspect-ratio:4/5;border-radius:var(--radius-badge);box-shadow:0 6px 18px rgba(0,0,0,.35)}

.m-iv--stats{display:grid;grid-template-columns:1fr 1fr;align-content:center}

.m-iv--stats>div{display:flex;flex-direction:column;padding:var(--space-3);border-radius:var(--radius-tile);background:var(--surface-card)}

.m-iv--steps>div,.m-iv--list>div{display:flex;align-items:center;gap:var(--space-2);padding:var(--space-2) var(--space-3);border-radius:var(--radius-tile);background:var(--surface-card)}

.m-iv__dot{flex:none;width:8px;height:8px;border-radius:50%;background:var(--text-primary)}

.m-iv__dot--off{background:transparent;box-shadow:inset 0 0 0 1.5px var(--text-tertiary)}

.m-iv__ck{flex:none;display:flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;font-size:11px;font-weight:700}

.m-iv__ck--ok{background:var(--status-success-bg);color:var(--status-success-fg)}

.m-iv__ck--warn{background:var(--status-warning-bg);color:var(--status-warning-fg)}

.m-iv__b{max-width:80%;padding:var(--space-2) var(--space-3);border-radius:14px}

.m-iv__b--in{align-self:flex-start;background:var(--surface-card)}

.m-iv__b--out{align-self:flex-end;background:var(--text-primary);color:var(--bg-page)}

.m-iv--doc{align-items:flex-start}

.m-iv__file{display:flex;align-items:center;gap:var(--space-3);width:100%;box-sizing:border-box;padding:var(--space-3);border-radius:var(--radius-tile);background:var(--surface-card)}

.m-iv__file>div{display:flex;flex-direction:column}

.m-iv__fic{flex:none;width:28px;height:36px;border-radius:4px;background:var(--surface-tile);box-shadow:inset 0 0 0 1px var(--border-card)}

.ws-intro .m-ic{width:196px}
.ws-intro .m-ic__prev{aspect-ratio:auto;height:112px}
.ws-intro .m-iv{padding:10px;gap:6px}
.ws-intro .m-iv--stats>div,.ws-intro .m-iv--steps>div,.ws-intro .m-iv--list>div{padding:5px 8px}
.ws-intro .m-iv .t-body-strong{font-size:12.5px;line-height:16px}
.ws-intro .m-iv .t-meta,.ws-intro .m-iv .t-caption{font-size:10.5px;line-height:14px}
.ws-intro .m-ic__body{padding:10px 12px 12px}
.ws-intro .m-ic__desc{font-size:12px;line-height:16px}
.g-landing{flex:1;min-height:0;display:flex;justify-content:center;padding:150px 24px 0;overflow:hidden}
.g-lcol{width:100%;max-width:760px;display:flex;flex-direction:column;align-items:center;gap:22px}
.g-lcol .g-dock{padding:0;width:100%}
.g-lcol .g-box{max-width:760px}
.ws-hello{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.ws-hello p{margin:0;max-width:540px;font-size:16px;line-height:24px;color:#0E2B30}

/* Mel brand layer (Mel brand guidelines): Deep Teal primary + text, Slate secondary, Line borders, Cloud tints, Mint Mist selected, mint focus ring, Night pressed, outline secondary buttons, rounded-square composer buttons */
.ws-root .g-item--on{background:#E2F5EA}
.ws-root .g-new:active,.ws-root .g-voice:active,.ws-root .g-btn:not(.g-btn--ghost):active,.ws-root .w-btn:active{background:#08191C}
.ws-root .g-voice{border-radius:12px}
.ws-root .g-share,.ws-root .g-btn--ghost,.ws-root .v-sharebtn{background:#FFFFFF;color:#0E2B30;border:1.5px solid #0E2B30}
.ws-root .g-share:hover,.ws-root .g-btn--ghost:hover,.ws-root .v-sharebtn:hover{background:#F3F9F6}
.ws-root .v-sharebtn[aria-expanded="true"]{background:#E2F5EA;border-color:#0E2B30}
.ws-root button:focus-visible,.ws-root a:focus-visible,.ws-root input[type="text"]:focus-visible{outline:none !important;box-shadow:0 0 0 3px #FFFFFF,0 0 0 6px #5ED6A0 !important}
</style>
</helmet>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>

const CARDS = ['Help me with marketing', 'Help me manage my clients', 'Help me set up a campaign', 'Help me keep clients updated', 'Check my compliance', 'Help me with documents'];
const SKILLS = [
  { id: 'crm', row: 'Manage clients', color: '#0FA3B1' },
  { id: 'marketing', row: 'Create posts', color: '#EE6A4C' },
  { id: 'campaigns', row: 'Run campaigns', color: '#E9A320' },
  { id: 'clients', row: 'Build client portal', color: '#E0588A' },
  { id: 'mls', row: 'Explore listings', color: '#8B6BC8' },
  { id: 'compliance', row: 'Check compliance', color: '#4479B3' },
  { id: 'document', row: 'Review documents', color: '#9C6B4F' }
];
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { draft: '', hist: null, card: 0 };
  }
  renderVals() {
    const open = this.state.hist === null ? !!(this.props.historyOpen ?? false) : this.state.hist;
    const draft = this.state.draft;
    return {
      draft: draft,
      hasDraft: draft.trim().length > 0,
      noDraft: draft.trim().length === 0,
      histOpen: open,
      histClosed: !open,
      setDraft: (e) => this.setState({ draft: e && e.target ? e.target.value : '' }),
      toggleHist: () => this.setState({ hist: !open }),
      newChat: () => this.setState({ draft: '' }),
      onRail: (e) => { const i = Math.round(e.target.scrollLeft / 208); if (i !== this.state.card) this.setState({ card: i }); },
      dots: CARDS.map((_, i) => ({ cls: i === this.state.card ? 'm-dot--on' : '' })),
      pickCard0: () => this.setState({ draft: CARDS[0] }),
      pickCard1: () => this.setState({ draft: CARDS[1] }),
      pickCard2: () => this.setState({ draft: CARDS[2] }),
      pickCard3: () => this.setState({ draft: CARDS[3] }),
      pickCard4: () => this.setState({ draft: CARDS[4] }),
      pickCard5: () => this.setState({ draft: CARDS[5] }),
      skills: SKILLS.map((k) => Object.assign({}, k, { pick: () => this.setState({ draft: k.row }) }))
    };
  }
}

</script>
