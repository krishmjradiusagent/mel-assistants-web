<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>

const ROWS = ["Approve 88 Harbor Lane", "Change approval mode", "Pause the routine", "Turn the routine off"];
const DESTS = [{"name": "Approval mode", "sub": "Mel asks before anything goes out", "chip": "Ask first", "tone": "slate"}, {"name": "Destinations", "sub": "Instagram, Facebook, Email", "chip": "3 connected", "tone": "success"}, {"name": "Recipients", "sub": "Active buyers matching the listing", "tone": "success"}, {"name": "Last run", "sub": "88 Harbor Lane, waiting for your approval", "chip": "Needs you", "tone": "warning"}];
const KEYS = ["ig", "fb", "li", "tt", "email", "web", "mls"];
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { draft: '', done: [] }; }
  renderVals() {
    return {
      draft: this.state.draft,
      setDraft: (e) => this.setState({ draft: e.target.value }),
      rows: ROWS.map((r) => { const [t, f] = Array.isArray(r) ? r : [r, r]; return { text: t, pick: () => this.setState({ draft: f }) }; }),
      dests: DESTS.map((d) => {
        const fixed = this.state.done.includes(d.name);
        const showBtn = !!d.btn && !fixed;
        const o = { ...d, hasIcon: !!d.icon, hasSub: !!d.sub, showBtn, showChip: !showBtn && !!(d.chip || fixed), chip: fixed ? 'Connected' : d.chip, chipCls: 'rm-chip t-chip tone-' + (fixed ? 'success' : (d.tone || 'success')), label: (d.btn || '') + ' ' + d.name, act: () => this.setState({ done: this.state.done.concat(d.name) }) };
        KEYS.forEach((k) => { o['is_' + k] = d.icon === k; });
        return o;
      })
    };
  }
}

</script>
